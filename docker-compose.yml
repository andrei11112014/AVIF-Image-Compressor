version: '3.8'

services:
  backend:
    build: backend
    container_name: avif_backend
    ports:
      - "0.0.0.0:3001:3001"
    restart: always

  frontend:
    build: frontend
    container_name: avif_frontend
    ports:
      - "0.0.0.0:3000:3000"
    depends_on:
      - backend
    restart: always
